name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, so new advisories against unchanged dependencies are still caught.
    - cron: "17 5 * * 1"
  workflow_dispatch:

# Jobs opt in to the access they need; nothing is granted by default.
permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Dependabot does not update this value; bump it by hand alongside `uv_build` in pyproject.toml.
  UV_VERSION: "0.13.8"
  FORCE_COLOR: "1"

jobs:
  lint:
    name: Lint and type check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked
      - name: Lint
        run: uv run --no-sync ruff check --output-format=github .
      - name: Check formatting
        run: uv run --no-sync ruff format --check .
      - name: Type check
        run: uv run --no-sync ty check
      - name: Audit workflows
        run: uv run --no-sync zizmor --offline .github

  test:
    name: Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked
      - name: Unit and integration tests
        run: uv run --no-sync pytest
      - name: Migration and framework checks
        env:
          # A throwaway value for this job's scratch database, not a credential.
          TGM_SECRET_KEY: ci-only-placeholder-key-0123456789abcdef
          TGM_DATABASE_URL: sqlite+aiosqlite:///./ci.db
          TGM_LOG_FORMAT: text
        run: |
          uv run --no-sync traceguard-manager migrate
          uv run --no-sync alembic check
          uv run --no-sync flasgo check traceguard_manager.asgi:app.web --deploy
          uv run --no-sync flasgo check traceguard_manager.asgi:app.api

  e2e:
    name: Browser tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked
      - name: Install Chromium
        run: uv run --no-sync playwright install --with-deps chromium
      - name: Browser tests
        run: uv run --no-sync pytest -m e2e --tracing=retain-on-failure
      - name: Upload traces
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-traces
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  audit:
    name: Dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - name: Check dependencies for known vulnerabilities
        run: uv audit --locked --preview-features audit-command
