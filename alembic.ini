# Used by `uv run flasgo db ...` during development.
# Deployments run `traceguard-manager migrate`, which needs no ini file.
# The database URL comes from TGM_DATABASE_URL, never from this file.
[alembic]
script_location = src/traceguard_manager/migrations
file_template = %%(rev)s_%%(slug)s
prepend_sys_path = src
